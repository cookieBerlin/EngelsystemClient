name: Feature request
description: An idea for the app
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could the app help?
      description: A rough idea is enough.
  - type: dropdown
    id: where
    attributes:
      label: For which device?
      options:
        - iPhone
        - iPad
        - Apple Watch
        - All of them
  - type: checkboxes
    id: server
    attributes:
      label: Does it need something the Engelsystem server does not offer?
      description: The app can only use what the Engelsystem REST API provides.
      options:
        - label: It may need a new or changed server function (I will say which if I know)
