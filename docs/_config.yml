title: Engelsystem Client
description: Engelsystem Client — an unofficial companion app for Engelsystem on iPhone, iPad and Apple Watch
url: https://cookieberlin.github.io
baseurl: /EngelsystemClient   # project site: https://cookieberlin.github.io/EngelsystemClient/
# Own Bootstrap 5 layout (docs/_layouts/default.html), no remote theme; every page uses it.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Only privacy.md/support.md/index.md are meant to be a public site — the rest of
# this folder is internal project documentation (architecture, implemented
# features, entitlements, history, roadmap, backlog, ADRs), not meant to be
# published as pages of its own. Excluded here rather than moved to a separate
# folder, so CLAUDE.md's existing cross-references into docs/*.md keep working
# unchanged.
exclude:
  - architecture.md
  - features.md
  - app-store.md
  - history.md
  - roadmap.md
  - backlog.md
  - requirements.md
  - testing.md
  - security.md
  - release.md
  - adr
